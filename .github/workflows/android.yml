# yamllint disable rule:line-length rule:truthy
---
name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Normalize gradlew line endings in case the file was committed with CRLF (prevents sed errors)
      - name: Ensure unix line endings for gradlew
        run: |
          perl -0777 -pe 's/\r//g' android/gradlew > android/gradlew.unix
          mv android/gradlew.unix android/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.5'
          cache: true

      - name: Resolve Flutter version
        id: flutter-version
        run: echo "version=$(flutter --version --machine | jq -r '.flutterVersion')" >> "$GITHUB_OUTPUT"

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.flutter
          key: flutter-sdk-${{ runner.os }}-${{ steps.flutter-version.outputs.version }}
          restore-keys: |
            flutter-sdk-${{ runner.os }}-

      - name: Flutter doctor
        run: flutter doctor
        working-directory: ./

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter-version.outputs.version }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter-version.outputs.version }}-
            pub-${{ runner.os }}-

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1

      - name: Vérifier la présence du NDK
        run: |
          if [ ! -d "${ANDROID_SDK_ROOT}/ndk/28.2.13676358" ]; then
            echo "::error title=NDK manquant::Le NDK n'est pas installé à l'emplacement attendu (${ANDROID_SDK_ROOT}/ndk/28.2.13676358)"
            exit 1
          fi
          echo "NDK trouvé dans ${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          set -euo pipefail
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          export NDK_HOME="$ANDROID_NDK_ROOT"
          if [ ! -d "$ANDROID_NDK_ROOT" ]; then
            echo "::error title=NDK introuvable::Le dossier ANDROID_NDK_ROOT='$ANDROID_NDK_ROOT' n'existe pas. Vérifiez l'installation du NDK et la variable d'environnement."
            exit 1
          fi
          echo "Using ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          rm -rf android/pjsip/pjproject-2.17
          chmod +x android/pjsip/build_pjsip.sh
          android/pjsip/build_pjsip.sh
          echo "Listing generated native libs:"
          find android/app/src/main/jniLibs -maxdepth 2 -type f \( -name "*.so" -o -name "*.a" \) -print

        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Debug jniLibs/arm64-v8a après build_pjsip.sh
        run: |
          echo "=== Contenu de android/app/src/main/jniLibs/arm64-v8a après build_pjsip.sh ==="
          ls -l android/app/src/main/jniLibs/arm64-v8a || true
          find android/app/src/main/jniLibs/arm64-v8a -type f \( -name "*.so" -o -name "*.a" \) -print || true
          echo "=== Vérification des headers PJSIP ==="
          if [ -f android/pjsip/pjproject-2.17/pjlib/include/pjlib.h ]; then
            echo "pjlib.h trouvé"
          else
            echo "pjlib.h manquant !" >&2
            exit 1
          fi

      - name: Debug libs PJSIP (pjsip/lib)
        run: |
          echo "=== Contenu de android/pjsip/pjproject-2.17/pjsip/lib ==="
          ls -l android/pjsip/pjproject-2.17/pjsip/lib || true

      - name: Debug symboles PJSIP (libpj.a)
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-${ANDROID_SDK_ROOT}/ndk/28.2.13676358}"
          NM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ ! -x "$NM_BIN" ]; then
            NM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/nm"
          fi
          if [ ! -x "$NM_BIN" ]; then
            echo "nm introuvable dans le NDK" >&2
            exit 1
          fi
          LIBPJ="android/app/src/main/jniLibs/arm64-v8a/libpj.a"
          if [ ! -f "$LIBPJ" ]; then
            echo "libpj.a introuvable: $LIBPJ" >&2
            exit 1
          fi
          echo "=== Symboles libpj.a (extraits) ==="
          "$NM_BIN" -g --defined-only "$LIBPJ" | grep -E "pj_strdup$|pj_strdup_with_null$|pj_pool_alloc$|pj_strcpy$" || true

      - name: Debug PJSIP sources and headers
        run: |
          echo "=== Contenu de android/pjsip ==="
          ls -l android/pjsip || true
          echo "=== Contenu de android/pjsip/pjproject-2.17 ==="
          ls -l android/pjsip/pjproject-2.17 || true
          echo "=== Contenu de android/pjsip/pjproject-2.17/pjlib/include ==="
          ls -l android/pjsip/pjproject-2.17/pjlib/include || true

      - name: Ensure Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Patch Gradle wrapper (avoid sed quoting issue)
        run: |
          perl -0777 -i -pe 's/save \(\) \{.*?^\}/save () { for i; do printf "%s\\n" "$i"; done; }/ms' android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore provided; skipping decode.";
            exit 0;
          fi
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "No google-services.json provided; skipping restore.";
            exit 0;
          fi
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          if ! jq -e . android/app/google-services.json >/dev/null 2>&1; then
            echo "::error title=Invalid JSON::google-services.json is not valid JSON. Recreate the secret with: base64 -w 0 google-services.json";
            exit 1;
          fi
          mkdir -p android/app/src/release
          cp -f android/app/google-services.json android/app/src/release/google-services.json

      - name: Validate google-services.json package
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "::error title=Missing google-services.json::File not found after restore"
            exit 1
          fi
          PKG=$(jq -r '.client[0].client_info.android_client_info.package_name' android/app/google-services.json)
          echo "google-services.json package: $PKG"
          if [ "$PKG" != "fr.celya.celyavox" ]; then
            echo "::error title=Package mismatch::google-services.json package $PKG != fr.celya.celyavox"
            exit 1
          fi

      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "No GoogleService-Info.plist provided; skipping restore.";
            exit 0;
          fi
          mkdir -p ios/Runner
          if ! printf "%s" "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode --ignore-garbage > ios/Runner/GoogleService-Info.plist; then
            echo "::error title=Invalid base64::GOOGLE_SERVICE_INFO_PLIST_BASE64 is not valid base64. Recreate the secret with: base64 -w 0 GoogleService-Info.plist";
            exit 1;
          fi

      - name: Vérifier les headers PJSIP avant build Flutter
        run: |
          echo "=== Vérification finale des headers PJSIP ==="
          if [ ! -f android/pjsip/pjproject-2.17/pjlib/include/pjlib.h ]; then
            echo "::error title=Header manquant::pjlib.h non trouvé avant build Flutter"
            exit 1
          fi
          if [ ! -f android/pjsip/pjproject-2.17/pjsip/include/pjsip.h ]; then
            echo "::error title=Header manquant::pjsip.h non trouvé avant build Flutter"
            exit 1
          fi
          echo "Headers PJSIP présents."

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get
        working-directory: ./


      - name: Build APK (release)
        run: flutter build apk --release --android-skip-build-dependency-validation
        working-directory: ./

      - name: Find and verify APK after build
        run: |
          echo "=== Searching for APK files anywhere in workspace ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo ""
          echo "=== Checking standard Flutter APK location ==="
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "✓ Found: build/app/outputs/flutter-apk/app-release.apk"
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          else
            echo "✗ Not found at: build/app/outputs/flutter-apk/app-release.apk"
          fi
          echo ""
          echo "=== Checking gradle build location ==="
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✓ Found: android/app/build/outputs/apk/release/app-release.apk"
            ls -lh android/app/build/outputs/apk/release/app-release.apk
          else
            echo "✗ Not found at: android/app/build/outputs/apk/release/app-release.apk"
          fi

      - name: Debug CMake logs if build fails
        if: failure()
        run: |
          echo "=== jniLibs contents ==="
          find android/app/src/main/jniLibs -type f || true
          echo "=== CMakeOutput.log ==="
          cat android/app/.cxx/release/*/arm64-v8a/CMakeFiles/CMakeOutput.log || true
          echo "=== CMakeError.log ==="
          cat android/app/.cxx/release/*/arm64-v8a/CMakeFiles/CMakeError.log || true

      - name: List build outputs (APK)
        run: |
          ls -R build/app/outputs || true
          ls -R android/app/build/outputs || true
          find build -maxdepth 6 -name "*.apk" -print || true
          find build -maxdepth 6 -name "*.aab" -print || true
          find android -maxdepth 6 -name "*.apk" -print || true
          find android -maxdepth 6 -name "*.aab" -print || true
        working-directory: ./

      - name: Build App Bundle (release)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon app:bundleRelease --stacktrace | tee ../build/gradle_bundle.log

      - name: Normalize AAB location
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -e
          mkdir -p build/app/outputs/bundle/release
          # Copy from either Gradle or Flutter output to the expected Flutter path
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp -f android/app/build/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/app-release.aab
          elif found=$(find android/app/build/outputs/bundle -name "*.aab" -print -quit); then
            cp -f "$found" build/app/outputs/bundle/release/app-release.aab
          elif found=$(find build/app/outputs/bundle -name "*.aab" -print -quit); then
            cp -f "$found" build/app/outputs/bundle/release/app-release.aab
          else
            echo "::error title=Missing AAB::No .aab found to normalize"; exit 1;
          fi
          ls -l build/app/outputs/bundle/release

      - name: Verify AAB output
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -e
          ls -l build/app/outputs/bundle/release || true
          ls -l android/app/build/outputs/bundle/release || true
          find build -maxdepth 6 -name "*.aab" -print || true
          find android -maxdepth 6 -name "*.aab" -print || true
          if [ ! -f build/app/outputs/bundle/release/app-release.aab ] && [ ! -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            echo "::error title=Missing AAB::app-release.aab not found in build/app/outputs/bundle/release or android/app/build/outputs/bundle/release";
            exit 1;
          fi
        working-directory: ./

      - name: List build outputs (AAB)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          ls -R build/app/outputs || true
          ls -R android/app/build/outputs || true
        working-directory: ./

      - name: Collect artifacts (flatten)
        run: |
          set -euo pipefail
          rm -rf build/artifacts
          mkdir -p build/artifacts/apk build/artifacts/aab
          find build/app/outputs -type f -name "*.apk" -exec cp -f {} build/artifacts/apk/ \; || true
          find android/app/build/outputs -type f -name "*.apk" -exec cp -f {} build/artifacts/apk/ \; || true
          find build/app/outputs -type f -name "*.aab" -exec cp -f {} build/artifacts/aab/ \; || true
          find android/app/build/outputs -type f -name "*.aab" -exec cp -f {} build/artifacts/aab/ \; || true
          if [ -f build/gradle_bundle.log ]; then
            cp -f build/gradle_bundle.log build/artifacts/aab/gradle_bundle.log
          fi
          ls -l build/artifacts/apk || true
          ls -l build/artifacts/aab || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: warn
          path: build/artifacts/apk/*

      - name: Upload AAB artifact
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          if-no-files-found: warn
          path: build/artifacts/aab/*
